<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      Конструктор курса — PixelStart
    </title>
    <link rel="stylesheet" href="../assets/styles.css?v=20260924e">
    <script src="../assets/api.js?v=20260924" defer>
    </script>
    <script src="../assets/app.js?v=20260924d" defer>
    </script>
  </head>
  <body class="admin-theme">
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="index.html">
          <span class="brand-mark">
            <i>
            </i>
            <i>
            </i>
            <i>
            </i>
            <i>
            </i>
          </span>
          <span>
            pixel
            <span>
              start
            </span>
            <b>
              admin
            </b>
          </span>
        </a>
        <nav class="side-nav">
          <a href="index.html">
            <span class="nav-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span>
            <span>
              Панель
            </span>
          </a>
          <a href="streams.html">
            <span class="nav-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/></svg></span>
            <span>
              Потоки
            </span>
          </a>
          <a class="active" href="course.html">
            <span class="nav-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
            <span>
              Курс
            </span>
          </a>
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="crumbs">
            Админ-панель /
            <strong>
              Конструктор курса
            </strong>
          </div>
          <a class="button button-soft" href="index.html">
            Назад
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle; margin-right:4px;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </a>
        </header>
        <div class="content">
          <div class="page-head">
            <div>
              <p class="eyebrow">
                POST /panel/courses
              </p>
              <h1>
                Собери
                <em>
                  курс
                </em>
              </h1>
            </div>
          </div>
          <section class="card">
            <form class="auth-form" data-form="course-create">
              <div class="field">
                <label for="title">
                  Название
                </label>
                <input id="title" name="title" required placeholder="Игры в Scratch">
              </div>
              <div class="field">
                <label for="type">
                  Тип курса
                </label>
                <select id="type" name="type">
                  <option value="scratch">
                    scratch
                  </option>
                  <option value="minecraft_edu">
                    minecraft_edu
                  </option>
                  <option value="algorithm">
                    algorithm
                  </option>
                  <option value="custom">
                    custom
                  </option>
                </select>
              </div>
              <div class="field">
                <label for="description">
                  Описание
                </label>
                <textarea id="description" name="description" placeholder="Что создаст ученик">
                </textarea>
              </div>
              <button class="button button-dark" type="submit">
                Опубликовать курс
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle; margin-left:4px;"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
              </button>
            </form>
            <p data-result class="page-lede" style="margin-top:18px">
            </p>
          </section>
          <section class="card" style="margin-top:18px">
            <h2>
              Следующие сущности
            </h2>
            <p>
              После создания курса API поддерживает уроки через `POST /panel/lessons` и задания через `POST /panel/lessons/{lesson_id}/tasks`.
            </p>
            <a class="button button-soft" href="lessons.html">
              Создать урок и задание
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle; margin-left:4px;"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            </a>
          </section>
        </div>
      </main>
    </div>
    <div class="toast" role="status">
    </div>
  </body>
</html>
