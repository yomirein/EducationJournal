            <span class="nav-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span>

            <span class="nav-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>

          <a href="streams.html">
            <span class="nav-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/></svg></span>

          <strong>Admin only</strong>
          Роль проверяется backend
          <span class="role">Admin</span>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="crumbs">
            Админ-панель /
            <strong>
              Пользователи
            </strong>
          </div>
          <a class="button button-soft" href="index.html">
            Назад
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle; margin-right:4px;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </a>
        </header>
        <div class="content">
          <div class="page-head">
            <div>
              <p class="eyebrow">
                GET /panel/users
              </p>
              <h1>
                Пользователи и
                <em>
                  роли
                </em>
              </h1>
            </div>
          </div>
          <section class="card">
            <div class="field-grid">
              <div class="field">
                <label for="role">
                  Фильтр роли
                </label>
                <select id="role">
                  <option value="">
                    Все
                  </option>
                  <option value="student">
                    student
                  </option>
                  <option value="curator">
                    curator
                  </option>
                  <option value="admin">
                    admin
                  </option>
                </select>
              </div>
              <button class="button button-soft" type="button" data-load-target="users">
                Загрузить пользователей
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle; margin-left:4px;"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
              </button>
            </div>
            <pre class="data-output" data-result="users">
              Нажми «Загрузить пользователей».
            </pre>
          </section>
          <section class="card" style="margin-top:18px">
            <h2>
              Изменить роль или оплату
            </h2>
            <form class="auth-form" data-form="user-patch">
              <div class="field-grid">
                <div class="field">
                  <label for="user_id">
                    ID пользователя
                  </label>
                  <input id="user_id" name="user_id" type="number" required>
                </div>
                <div class="field">
                  <label for="user_role">
                    Роль
                  </label>
                  <select id="user_role" name="role">
                    <option value="student">
                      student
                    </option>
                    <option value="curator">
                      curator
                    </option>
                    <option value="admin">
                      admin
                    </option>
                  </select>
                </div>
                <div class="field">
                  <label for="payment">
                    Оплата
                  </label>
                  <select id="payment" name="payment">
                    <option value="true">
                      Оплачено
                    </option>
                    <option value="false">
                      Не оплачено
                    </option>
                  </select>
                </div>
              </div>
              <button class="button button-dark" type="submit">
                Применить изменения
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle; margin-left:4px;"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
              </button>
            </form>
          </section>
        </div>
      </main>
    </div>
    <div class="toast" role="status">
    </div>
