<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      Профиль — PixelStart
    </title>
    <link rel="stylesheet" href="../assets/styles.css">
    <script src="../assets/api.js" defer>
    </script>
    <script src="../assets/app.js" defer>
    </script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="index.html">
          <span class="brand-mark">
            <i>
            </i>
            <i>
            </i>
            <i>
            </i>
            <i>
            </i>
          </span>
          <span>
            pixel
            <span>
              start
            </span>
            <b>
              kids
            </b>
          </span>
        </a>
        <nav class="side-nav">
          <a href="index.html">
            <span class="nav-icon">
              ⌂
            </span>
            <span>
              Журнал
            </span>
          </a>
          <a href="courses.html">
            <span class="nav-icon">
              ▦
            </span>
            <span>
              Мои курсы
            </span>
          </a>
          <a href="catalog.html">
            <span class="nav-icon">
              +
            </span>
            <span>
              Каталог
            </span>
          </a>
          <a class="active" href="profile.html">
            <span class="nav-icon">
              ●
            </span>
            <span>
              Профиль
            </span>
          </a>
          <a href="settings.html">
            <span class="nav-icon">
              ⚙
            </span>
            <span>
              Настройки
            </span>
          </a>
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="crumbs">
            Аккаунт /
            <strong>
              Профиль
            </strong>
          </div>
          <a class="button button-soft" href="settings.html">
            Настройки
            <span>
              ↗
            </span>
          </a>
        </header>
        <div class="content">
          <div class="page-head">
            <div>
              <p class="eyebrow">
                GET /users/me
              </p>
              <h1>
                Мой
                <em>
                  профиль
                </em>
              </h1>
            </div>
          </div>
          <section class="card">
            <pre class="data-output" data-load="/users/me">
              Загрузка данных пользователя...
            </pre>
          </section>
          <section class="card" style="margin-top:18px">
            <h2>
              Обновить описание
            </h2>
            <form class="auth-form" data-form="profile">
              <div class="field">
                <label for="description">
                  Описание
                </label>
                <textarea id="description" name="description" placeholder="Что тебе интересно?">
                </textarea>
              </div>
              <div class="field">
                <label for="email">
                  Почта
                </label>
                <input id="email" name="email" type="email">
              </div>
              <button class="button button-dark" type="submit">
                Применить изменения
                <span>
                  ↗
                </span>
              </button>
            </form>
          </section>
        </div>
      </main>
    </div>
    <div class="toast" role="status">
    </div>
  </body>
</html>
