ющие сущности</h2><p>После создания курса API поддерживает уроки через `POST /panel/lessons` и задания через `POST /panel/lessons/{lesson_id}/tasks`.</p><a class="button button-soft" href="lessons.html">Создать урок и задание <span>↗</span></a></section></div></main></div><div class="toast" role="status"></div></body></html>
