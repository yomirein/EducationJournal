Аккаунт:
    Окно логина и регистрации
    Поля пользователя:
        Имя Фамилия
        Логин
        Почта
        Пароль
    Пользовательское соглашение
Вход по JWT токену
Поля потоков и ролей

Типы аккаунтов:
  Администратор
  Куратор
  Ученик

Ядро:
  Администратор:
    Может создавать курсы
    Управляет всем ниже
  Куратор:
    Управляет потоками и своими учениками
  Ученик:
    Имеет возможность подключатся к потокам по заявкам

Что можно будет вставить в курс:
  Scratch: блочный конструктор,
    На сайте: всё строится и отправляется в апи
    Бэк: проверяет входные данные
  Minecraft Education:
    Скретч но в стилистике майнкрафта
  Алгоритмика:
    Решение задач
  Любой курс:
    Настраивает администратор(?)

Подсчёт статистики пользователя

По интерфейсу:
  Экран логина и регистрации
  Экран воостановления аккаунта и пароля

  Панель администратора:
    Создание курса
      Конструктор для создания курса с заданиями
      Для Scratch:
        Конструктор как и учеников
      Для остального:
        Текст и ввод ученика
      Minecraft Edu: (?)

    Управление ролями пользователей(Добавление куратора или удаление)
    Управление потоками
    Рассылки по почтам

  Панель куратора:
    Управление потоком
    Добавление объявлений
    Просмотр занятия:
      Ручное управление оценками ученка за занятие, и его загрузок(с возможностью удаления по причине)

  Журнал ученика:
    Профиль ученика
    Профиль куратора

    Расписание(с индикатором выполненного задания)
    Рейтинг
    История заданий и обратная связь
    Выполнение заданий по занятию


Поток:
  Дата начала и конца
  К нему привязан один куратор
    Куратор обязан провести учеников от начала до конца
  Ученики в нём находятся и проходят по нему вместе

  Доска объявлений от куратора



  База данных:
    Типы user_roles:
      Admin
      Curator
      Student
    Типы курсов step_types:
      minecraft_edu
      scratch
      algorithm
      custom


    Поле users:
      id,
      first_name,
      last_name,
      username,
      password,
      email,
      desctiption
      role_mnemocode
      confirmed_docs: []
      payment bool

    Поле stream_rating:
      user_id,
      rating int

    Поле course:
      id,
      title,
      description
      type

    Поле stream:
      course_id,
      curator_id,
      name,
      start_date,
      end_date

    Поле stream_participants
      user_id,
      stream_id
      user_stream_rating

    Поле module_lesson_task
      id
      other
      type: step_types
      description
      created_at
      (answer_json)

    Поле module_lesson_user_task
      id
      task_id
      user_id
      file_id TEXT
      input TEXT
      feedback_message
      grade (если -1, не сделан/ответ не отправлен, если 0 - значит на проверке или не выставлен)

    Поле module_lesson
      id
      module_id
      type
      duration

    Поле stream_broadcasts
      id
      stream_id
      broadcast_id

    Поле broadcast
      id
      timestamp
      curator_id
      text # сделать поддержку Markdown

    Поле module
      id
      name
      description

