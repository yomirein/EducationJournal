<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      Восстановление — PixelStart
    </title>
    <link rel="stylesheet" href="../assets/styles.css">
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-art">
        <div class="auth-art-content">
          <a class="brand brand-large" href="../index.html">
            <span class="brand-mark">
              <i>
              </i>
              <i>
              </i>
              <i>
              </i>
              <i>
              </i>
            </span>
            <span>
              pixel
              <span>
                start
              </span>
              <b>
                kids
              </b>
            </span>
          </a>
          <h1>
            Забытый пароль.
            <br>
            <em>
              Новый маршрут.
            </em>
          </h1>
          <p>
            API-прототип пока не содержит endpoint восстановления, поэтому экран готов как следующий backend-контракт.
          </p>
        </div>
      </section>
      <section class="auth-form-side">
        <div class="auth-card">
          <a class="brand" href="../index.html">
            <span class="brand-mark">
              <i>
              </i>
              <i>
              </i>
              <i>
              </i>
              <i>
              </i>
            </span>
            <span>
              pixel
              <span>
                start
              </span>
              <b>
                kids
              </b>
            </span>
          </a>
          <h2>
            Восстановление
          </h2>
          <p>
            Форма готова для будущего endpoint reset-password.
          </p>
          <form class="auth-form">
            <div class="field">
              <label for="identity">
                Логин или почта
              </label>
              <input id="identity" required>
            </div>
            <button class="button button-dark" type="button" data-toast="Backend endpoint восстановления будет подключён здесь.">
              Отправить код
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle; margin-left:4px;"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            </button>
          </form>
          <p class="auth-switch">
            <a href="login.html">
              Вернуться ко входу
            </a>
          </p>
        </div>
      </section>
    </main>
    <div class="toast" role="status">
    </div>
    <script src="../assets/api.js" defer>
    </script>
    <script src="../assets/app.js" defer>
    </script>
  </body>
</html>
