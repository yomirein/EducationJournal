<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      Проверка — PixelStart
    </title>
    <link rel="stylesheet" href="../assets/styles.css">
    <script src="../assets/api.js" defer>
    </script>
    <script src="../assets/app.js" defer>
    </script>
  </head>
  <body class="curator-theme">
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="index.html">
          <span class="brand-mark">
            <i>
            </i>
            <i>
            </i>
            <i>
            </i>
            <i>
            </i>
          </span>
          <span>
            pixel
            <span>
              start
            </span>
            <b>
              curator
            </b>
          </span>
        </a>
        <nav class="side-nav">
          <a href="index.html">
            <span class="nav-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </span>
            <span>
              Панель
            </span>
          </a>
          <a href="participants.html">
            <span class="nav-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </span>
            <span>
              Ученики
            </span>
          </a>
          <a class="active" href="review.html">
            <span class="nav-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
            <span>
              Проверка
            </span>
          </a>
          <a href="broadcast.html">
            <span class="nav-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            <span>
              Объявления
            </span>
          </a>
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="crumbs">
            Поток /
            <strong>
              Проверка работ
            </strong>
          </div>
          <a class="button button-soft" href="index.html">
            Назад
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle; margin-right:4px;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </a>
        </header>
        <div class="content">
          <div class="page-head">
            <div>
              <p class="eyebrow">
                Проверка и обратная связь
              </p>
              <h1>
                Очередь
                <em>
                  решений
                </em>
              </h1>
            </div>
            <p class="page-lede">
              Выбирай работу ученика, запускай предпросмотр кода и алгоритма, выставляй оценки в один клик.
            </p>
          </div>
          <div id="submissions-board-section" class="card" style="margin-bottom:22px;"></div>
          <section class="card" style="opacity:0.85;">
            <h2>
              Ручной ввод (API Fallback)
            </h2>
            <form class="auth-form" data-form="grade">
              <div class="field-grid">
                <div class="field">
                  <label for="stream_id">
                    ID потока
                  </label>
                  <input id="stream_id" name="stream_id" type="number" value="1" required>
                </div>
                <div class="field">
                  <label for="task_id">
                    ID задания
                  </label>
                  <input id="task_id" name="task_id" type="number" value="1" required>
                </div>
                <div class="field">
                  <label for="submission_id">
                    ID отправки
                  </label>
                  <input id="submission_id" name="submission_id" type="number" required>
                </div>
                <div class="field">
                  <label for="grade">
                    Оценка -1..100
                  </label>
                  <input id="grade" name="grade" type="number" min="-1" max="100" required>
                </div>
                <div class="field full">
                  <label for="feedback_message">
                    Обратная связь
                  </label>
                  <textarea id="feedback_message" name="feedback_message" placeholder="Что получилось и что попробовать дальше">
                  </textarea>
                </div>
              </div>
              <button class="button button-dark" type="submit">
                Сохранить оценку
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle; margin-left:4px;"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
              </button>
            </form>
          </section>
          <section class="card" style="margin-top:18px">
            <h2>
              Удалить файл с причиной
            </h2>
            <form class="auth-form" data-form="reject-file">
              <div class="field-grid">
                <div class="field">
                  <label for="remove-stream">
                    ID потока
                  </label>
                  <input id="remove-stream" name="stream_id" type="number" value="1">
                </div>
                <div class="field">
                  <label for="remove-task">
                    ID задания
                  </label>
                  <input id="remove-task" name="task_id" type="number" value="1">
                </div>
                <div class="field">
                  <label for="remove-submission">
                    ID отправки
                  </label>
                  <input id="remove-submission" name="submission_id" type="number">
                </div>
                <div class="field">
                  <label for="reason">
                    Причина
                  </label>
                  <input id="reason" name="reason" required>
                </div>
              </div>
              <button class="button button-danger" type="submit">
                Удалить файл
                <span>
                  ×
                </span>
              </button>
            </form>
          </section>
        </div>
      </main>
    </div>
    <div class="toast" role="status">
    </div>
  </body>
</html>
