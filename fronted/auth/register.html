<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Регистрация — PixelStart</title><link rel="stylesheet" href="../assets/styles.css"><script src="../assets/api.js" defer></script><script src="../assets/app.js" defer></script></head><body><main class="auth-page"><section class="auth-art"><div class="auth-art-content"><a class="brand brand-large" href="../index.html"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span>pixel<span>start</span><b>kids</b></span></a><h1>Создай аккаунт.<br><em>Собери проект.</em></h1><p>Публичная регистрация создаёт аккаунт ученика. Администраторские и кураторские роли назначаются сервером.</p></div></section><section class="auth-form-side"><div class="auth-card"><a class="brand" href="../index.html"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span>pixel<span>start</span><b>kids</b></span></a><h2>Регистрация</h2><p>Данные отправятся в `POST /auth/register`.</p><form class="auth-form" data-form="register"><div class="field-grid"><div class="field"><label for="first_name">Имя</label><input id="first_name" name="first_name" required></div><div class="field"><label for="last_name">Фамилия</label><input id="last_name" name="last_name" required></div></div><div class="field"><label for="username">Логин</label><input id="username" name="username" minlength="3" required></div><div class="field"><label for="email">Почта</label><input id="email" name="email" type="email" required></div><div class="field"><label for="password">Пароль</label><input id="password" name="password" type="password" minlength="8" required></div><label class="check-row"><input type="checkbox" required><span>Принимаю пользовательское соглашение.</span></label><button class="button button-dark" type="submit">Создать аккаунт <span>↗</span></button></form><p class="auth-switch"><a href="login.html">Уже есть аккаунт? Войти</a></p></div></section></main><div class="toast" role="status"></div></body></html>
