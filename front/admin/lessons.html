      <main class="main">
        <header class="topbar">
          <div class="topbar-left">
            <a class="topbar-back" href="course.html" title="К курсу" aria-label="К курсу"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a>
            <div class="crumbs">
              Администрирование /
              <strong>
                Уроки и задания
              </strong>
            </div>
          </div>
        </header>
        <div class="content">
          <div class="page-head">
            <div>
              <p class="eyebrow">
                Конструктор содержания
              </p>
              <h1>
                Уроки и
                <em>
                  задания
                </em>
              </h1>
            </div>
            <p class="page-lede">
              Добавляйте уроки в модули программы и привязывайте практические задания.
            </p>
          </div>
          <section class="card">
            <form class="auth-form" data-form="lesson-create">
              <div class="field-grid">
                <div class="field">
                  <label for="module_id">
                    Модуль
                  </label>
                  <select id="module_id" name="module_id" required data-options="modules"></select>
                </div>
                <div class="field">
                  <label for="duration">
                    Длительность, минут
                  </label>
                  <input id="duration" name="duration" type="number" value="15" min="0">
                </div>
                <div class="field full">
                  <label for="lesson_type">
                    Тип урока
                  </label>
                  <input id="lesson_type" name="type" value="lesson">
                </div>
              </div>
              <button class="button button-dark" type="submit">
                Создать урок
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle; margin-left:4px;"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
              </button>
            </form>
          </section>
          <section class="card" style="margin-top:18px">
            <form class="auth-form" data-form="task-create">
              <div class="field-grid">
                <div class="field">
                  <label for="lesson_id">
                    Урок
                  </label>
                  <select id="lesson_id" name="lesson_id" required data-options="lessons"></select>
                </div>
                <div class="field">
                  <label for="task_type">
                    Тип задания
                  </label>
                  <select id="task_type" name="type">
                    <option value="theory">Теория</option>
                    <option value="quiz">Контрольный вопрос</option>
                    <option value="scratch">Scratch (проект)</option>
                    <option value="minecraft_edu">Minecraft Education (постройка)</option>
                    <option value="code_test">Задача с тестами (Python)</option>
                    <option value="project">Проект курса</option>
                    <option value="algorithm">Алгоритмика (задача)</option>
                    <option value="custom">Пользовательское задание</option>
                  </select>
                </div>
                <div class="field full">
                  <label for="task_description">
                    Описание задания
                  </label>
                  <textarea id="task_description" name="description" required>
                  </textarea>
                </div>
              </div>
              <button class="button button-dark" type="submit">
                Создать задание
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle; margin-left:4px;"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
              </button>
            </form>
          </section>
        </div>
      </main>

    <div class="toast" role="status">
    </div>
