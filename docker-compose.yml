services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: learning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local mail catcher for development: SMTP on 1025, web UI on http://127.0.0.1:8025.
  # Nothing is delivered to real inboxes. Point MAIL_SERVER at it (see README).
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  api:
    build: .
    env_file: .env
    environment:
      # Inside the compose network the database is reachable as "db", not localhost.
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/learning
    ports: ["8000:8000"]
    volumes: ["./uploads:/app/uploads"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
