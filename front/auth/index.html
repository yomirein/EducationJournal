  <body>
    <main class="auth-page">
      <section class="auth-art">

              </i>
              <i>

              pixel

              </span>
              <b>
                kids
              </b>
            </span>
          </a>
          <h1>
            Твой код.
            <br>
            <em>
              Твой мир.
            </em>

            Войди или создай профиль, чтобы курсы, задания и прогресс были привязаны к твоему аккаунту.
          </p>
          <div class="auth-terminal">
            &gt; start_adventure()
            <br>
            <span style="color:var(--coral)">status</span> = <span style="color:var(--lime)">active</span>
            <br>
            &gt; <span style="color:var(--yellow)">start!</span>
          </div>
        </div>

      <section class="auth-form-side">

          <a class="brand" href="../index.html">
            <span class="brand-mark">

          </p>
          <div class="entry-actions">
            <a class="button button-dark" href="login.html">
              Войти
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle; margin-left:4px;"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
