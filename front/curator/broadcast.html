<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Объявление — PixelStart
    </title>
    <link rel="stylesheet" href="../assets/styles.css">
    <script src="../assets/api.js" defer>
    </script>
    <script src="../assets/app.js" defer>
    </script>
  </head>
  <body class="curator-theme">
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="index.html">
          <span class="brand-mark">
            <i>
            </i>
            <i>
            </i>
            <i>
            </i>
            <i>
            </i>
          </span>
          <span>
            pixel
            <span>
              start
            </span>
            <b>
              curator
            </b>
          </span>
        </a>
        <nav class="side-nav">
          <a href="index.html">
            <span class="nav-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span>
            <span>
              Панель
            </span>
          </a>
          <a href="participants.html">
            <span class="nav-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <span>
              Ученики
            </span>
          </a>
          <a href="review.html">
            <span class="nav-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>
            <span>
              Проверка
            </span>
          </a>
          <a class="active" href="broadcast.html">
            <span class="nav-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
            <span>
              Объявления
            </span>
          </a>
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="crumbs">
            Поток /
            <strong>
              Объявления
            </strong>
          </div>
          <a class="button button-soft" href="index.html">
            Назад
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle; margin-right:4px;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </a>
        </header>
        <div class="content">
          <div class="page-head">
            <div>
              <p class="eyebrow">
                POST /streams/{stream_id}/broadcasts
              </p>
              <h1>
                Сообщение
                <em>
                  потоку
                </em>
              </h1>
            </div>
          </div>
          <section class="card">
            <form class="auth-form" data-form="broadcast">
              <div class="field">
                <label for="stream_id">
                  ID потока
                </label>
                <input id="stream_id" name="stream_id" type="number" value="1" required>
              </div>
              <div class="field">
                <label for="text">
                  Текст объявления
                </label>
                <textarea id="text" name="text" required placeholder="Поддерживается Markdown на уровне текста">
                </textarea>
              </div>
              <button class="button button-dark" type="submit">
                Опубликовать
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle; margin-left:4px;"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
              </button>
            </form>
          </section>
          <section class="card" style="margin-top:18px">
            <h2>
              Предыдущие объявления
            </h2>
            <div class="entry-actions">
              <input name="stream_id" type="number" value="1" aria-label="ID потока">
              <button class="button button-soft" type="button" data-load-target="broadcasts">
                Загрузить
              </button>
            </div>
            <pre class="data-output" data-result="broadcasts">
              Нажми «Загрузить».
            </pre>
          </section>
        </div>
      </main>
    </div>
    <div class="toast" role="status">
    </div>
  </body>
</html>
