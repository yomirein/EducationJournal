<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      Вход — PixelStart
    </title>
    <link rel="stylesheet" href="../assets/styles.css?v=20260925">
    <script src="../assets/api.js?v=20260925" defer>
    </script>
    <script src="../assets/app.js?v=20260925" defer>
    </script>
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-art">
        <div class="auth-art-content">
          <a class="brand brand-large" href="../index.html">
            <span class="brand-mark">
              <i>
              </i>
              <i>
              </i>
              <i>
              </i>
              <i>
              </i>
            </span>
            <span>
              pixel
              <span>
                start
              </span>
              <b>
                kids
              </b>
            </span>
          </a>
          <h1>
            С возвращением.
            <br>
            <em>
              Продолжим?
            </em>
          </h1>
          <p>
            Твои курсы, задания и обратная связь ждут внутри.
          </p>
        </div>
      </section>
      <section class="auth-form-side">
        <div class="auth-card">
          <a class="brand" href="../index.html">
            <span class="brand-mark">
              <i>
              </i>
              <i>
              </i>
              <i>
              </i>
              <i>
              </i>
            </span>
            <span>
              pixel
              <span>
                start
              </span>
              <b>
                kids
              </b>
            </span>
          </a>
          <h2>
            Вход в систему
          </h2>
          <p style="font-size:13px; color:var(--muted); margin-bottom:16px;">
            Выберите демо-роль для входа в 1 клик или введите логин и пароль:
          </p>

          <!-- 1-Click Quick Demo Login Presets -->
          <div style="background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:18px;">
            <div style="font-size:11px; text-transform:uppercase; font-weight:800; color:var(--accent); letter-spacing:0.06em; margin-bottom:8px;">
              Быстрый вход для жюри и тестов:
            </div>
            <div style="display:flex; flex-direction:column; gap:8px;">
              <button class="button button-lime" type="button" style="width:100%; justify-content:space-between; min-height:38px; padding:0 12px; font-size:12px; font-weight:700;" onclick="handleQuickLogin('student', 'student12345', '../student/index.html')">
                <span>Войти как <strong>Ученик</strong> (Иван)</span>
                <span style="opacity:0.75; font-size:11px; font-family:monospace;">student / student12345</span>
              </button>
              <button class="button button-soft" type="button" style="width:100%; justify-content:space-between; min-height:38px; padding:0 12px; font-size:12px; font-weight:700;" onclick="handleQuickLogin('curator', 'curator12345', '../curator/index.html')">
                <span>Войти как <strong>Куратор</strong> (Анна)</span>
                <span style="opacity:0.75; font-size:11px; font-family:monospace;">curator / curator12345</span>
              </button>
              <button class="button button-soft" type="button" style="width:100%; justify-content:space-between; min-height:38px; padding:0 12px; font-size:12px; font-weight:700;" onclick="handleQuickLogin('admin', 'admin12345', '../admin/index.html')">
                <span>Войти как <strong>Администратор</strong></span>
                <span style="opacity:0.75; font-size:11px; font-family:monospace;">admin / admin12345</span>
              </button>
            </div>
          </div>

          <div style="text-align:center; font-size:12px; color:var(--muted); margin-bottom:14px; position:relative;">
            <span style="background:var(--card-bg, #fff); padding:0 8px; position:relative; z-index:1;">или ручной ввод данных</span>
            <div style="position:absolute; top:50%; left:0; right:0; height:1px; background:var(--border); z-index:0;"></div>
          </div>

          <form class="auth-form" data-form="login">
            <div class="field">
              <label for="login">
                Логин или почта
              </label>
              <input id="login" name="login" placeholder="student" required>
            </div>
            <div class="field">
              <label for="password">
                Пароль
              </label>
              <input id="password" name="password" type="password" placeholder="••••••••" required>
            </div>
            <button class="button button-dark" type="submit" id="btn-submit-login">
              Войти
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle; margin-left:4px;"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            </button>
          </form>

          <script>
            async function handleQuickLogin(login, password, redirectUrl) {
              const loginInput = document.getElementById('login');
              const passwordInput = document.getElementById('password');
              if (loginInput) loginInput.value = login;
              if (passwordInput) passwordInput.value = password;

              try {
                const res = await window.pixelApi.post('/auth/login', { login, password });
                window.pixelApi.auth.save(res);
                const user = await window.pixelApi.get('/users/me').catch(() => null);
                if (user) {
                  localStorage.setItem('pixelstart_user', JSON.stringify(user));
                }
                window.location.href = redirectUrl;
              } catch (e) {
                alert('Ошибка авторизации: ' + e.message);
              }
            }
          </script>
          <p class="auth-switch">
            <a href="reset.html">
              Восстановить пароль
            </a>
            ·
            <a href="register.html">
              Создать аккаунт
            </a>
          </p>
        </div>
      </section>
    </main>
    <div class="toast" role="status">
    </div>
  </body>
</html>
