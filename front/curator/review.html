<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      Проверка — PixelStart
    </title>
    <link rel="stylesheet" href="../assets/styles.css">
    <script src="../assets/api.js" defer>
    </script>
    <script src="../assets/app.js" defer>
    </script>
  </head>
  <body class="curator-theme">
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="index.html">
          <span class="brand-mark">
            <i>
            </i>
            <i>
            </i>
            <i>
            </i>
            <i>
            </i>
          </span>
          <span>
            pixel
            <span>
              start
            </span>
            <b>
              curator
            </b>
          </span>
        </a>
        <nav class="side-nav">
          <a href="index.html">
            <span class="nav-icon">
              ▦
            </span>
            <span>
              Панель
            </span>
          </a>
          <a href="participants.html">
            <span class="nav-icon">
              ●
            </span>
            <span>
              Ученики
            </span>
          </a>
          <a class="active" href="review.html">
            <span class="nav-icon">
              ✓
            </span>
            <span>
              Проверка
            </span>
          </a>
          <a href="broadcast.html">
            <span class="nav-icon">
              ✉
            </span>
            <span>
              Объявления
            </span>
          </a>
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="crumbs">
            Поток /
            <strong>
              Проверка работ
            </strong>
          </div>
          <a class="button button-soft" href="index.html">
            Назад
            <span>
              ↙
            </span>
          </a>
        </header>
        <div class="content">
          <div class="page-head">
            <div>
              <p class="eyebrow">
                PATCH /streams/{stream}/tasks/{task}/submissions
              </p>
              <h1>
                Проверка
                <em>
                  работ
                </em>
              </h1>
            </div>
          </div>
          <section class="card">
            <h2>
              Выставить оценку
            </h2>
            <form class="auth-form" data-form="grade">
              <div class="field-grid">
                <div class="field">
                  <label for="stream_id">
                    ID потока
                  </label>
                  <input id="stream_id" name="stream_id" type="number" value="1" required>
                </div>
                <div class="field">
                  <label for="task_id">
                    ID задания
                  </label>
                  <input id="task_id" name="task_id" type="number" value="1" required>
                </div>
                <div class="field">
                  <label for="submission_id">
                    ID отправки
                  </label>
                  <input id="submission_id" name="submission_id" type="number" required>
                </div>
                <div class="field">
                  <label for="grade">
                    Оценка -1..100
                  </label>
                  <input id="grade" name="grade" type="number" min="-1" max="100" required>
                </div>
                <div class="field full">
                  <label for="feedback_message">
                    Обратная связь
                  </label>
                  <textarea id="feedback_message" name="feedback_message" placeholder="Что получилось и что попробовать дальше">
                  </textarea>
                </div>
              </div>
              <button class="button button-dark" type="submit">
                Сохранить оценку
                <span>
                  ↗
                </span>
              </button>
            </form>
          </section>
          <section class="card" style="margin-top:18px">
            <h2>
              Удалить файл с причиной
            </h2>
            <form class="auth-form" data-form="reject-file">
              <div class="field-grid">
                <div class="field">
                  <label for="remove-stream">
                    ID потока
                  </label>
                  <input id="remove-stream" name="stream_id" type="number" value="1">
                </div>
                <div class="field">
                  <label for="remove-task">
                    ID задания
                  </label>
                  <input id="remove-task" name="task_id" type="number" value="1">
                </div>
                <div class="field">
                  <label for="remove-submission">
                    ID отправки
                  </label>
                  <input id="remove-submission" name="submission_id" type="number">
                </div>
                <div class="field">
                  <label for="reason">
                    Причина
                  </label>
                  <input id="reason" name="reason" required>
                </div>
              </div>
              <button class="button button-danger" type="submit">
                Удалить файл
                <span>
                  ×
                </span>
              </button>
            </form>
          </section>
        </div>
      </main>
    </div>
    <div class="toast" role="status">
    </div>
  </body>
</html>
