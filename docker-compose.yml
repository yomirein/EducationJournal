services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: learning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./uploads:/app/uploads"]
    depends_on: [db]
volumes:
  pgdata:
